name: Monitor

on:
  schedule:
    # Minuto quebrado de proposito: a hora cheia e a meia hora sao as faixas
    # mais disputadas do agendador do GitHub, e agendamento la e best-effort.
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Duas execuções ao mesmo tempo brigariam pelo commit do estado.
concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Rodar monitor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEATS_API_KEY: ${{ secrets.SEATS_API_KEY }}
        run: python main.py

      - name: Commitar estado
        run: |
          if [[ -z "$(git status --porcelain state/seen.json)" ]]; then
            echo "Nada novo no estado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          git commit -m "estado: deals vistos [skip ci]"
          # concurrency ja impede duas execucoes disto ao mesmo tempo, mas nao
          # impede um push de fora chegar antes -- e com gatilho externo a cada
          # 15 min a janela para isso deixa de ser desprezivel. Sem o rebase, a
          # execucao falha e o estado daquela rodada se perde: os deals ja foram
          # alertados e voltariam como novos na rodada seguinte.
          for tentativa in 1 2 3; do
            git push && exit 0
            echo "push recusado (tentativa $tentativa); rebasando"
            git pull --rebase --autostash
          done
          git push
