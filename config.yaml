# So alerta o que foi publicado nas ultimas N horas. Promocao de ontem
# costuma ter expirado, e sem isso o backlog do canal vira alerta.
max_idade_horas: 24

# Cotacao do milheiro: R$ por 1.000 milhas. Serve para converter milhas em
# reais e poder comparar os dois precos de bate-pronto no alerta.
# E estimativa, nao preco de mercado -- ajuste conforme as promocoes de compra
# de pontos. Programa sem entrada propria usa "padrao".
milheiro:
  padrao: 18.00
  Smiles: 16.50
  LATAM Pass: 19.00
  Azul Fidelidade: 18.00
  Livelo: 30.00
  Esfera: 30.00

# Rotas vigiadas no Google Flights (preco em dinheiro). Esta e a unica fonte
# que CONSULTA uma rota; as demais so reagem ao que os portais publicaram.
#
# destinos aceita codigo IATA, atalho de regiao, ou os dois misturados.
# Atalhos: europa, america_do_norte, america_do_sul, asia, africa, oceania.
#
# CUSTO: cada destino x data e uma consulta. Europa sao 14 aeroportos; com 6
# datas amostradas da 84 consultas (~90s). Por isso a cadencia e menor que a
# do resto e as datas sao amostradas, uma por mes.
google_cadencia_horas: 6
google_amostras_de_data: 6

rotas:
  - nome: Europa a partir de SP
    origens: [GRU]
    destinos: europa
    max_preco_brl: 2500
    min_queda_pct: 30
    enabled: true

  - nome: Vizinhos baratos
    origens: [GRU]
    destinos: america_do_sul
    max_preco_brl: 900
    enabled: true

  # Rota especifica: so listar os IATA.
  - nome: Tokyo
    origens: [GRU]
    destinos: [NRT, HND]
    min_queda_pct: 25
    enabled: false

# Canais publicos do Telegram, lidos pela previa web em t.me/s/<canal>.
# Rendem mais sinal que o RSS dos mesmos portais e nao exigem token.
canais:
  - nome: Melhores Destinos
    canal: melhoresdestinos
  - nome: Passageiro de Primeira
    canal: passageirodeprimeira
  - nome: Pontos pra Voar
    canal: canalpontospravoar
  - nome: Milhas sem Segredo
    canal: milhas_sem_segredo

# Mantido para o Melhores Destinos, cujo canal so traz a chamada curta:
# o feed acrescenta o resumo do artigo, que ajuda a extracao.
feeds:
  - nome: Melhores Destinos — Promoção de Milhas
    url: https://www.melhoresdestinos.com.br/category/promocao-de-milhas/feed

# Campo ausente = sem filtro.
# Entre campos diferentes o casamento é E; entre max_milhas e max_preco_brl é OU.
alertas:
  - nome: Executiva de SP para o exterior
    kind: voo
    origens: [GRU, VCP, CGH, SAO]
    cabines: [executiva, primeira]
    max_milhas: 120000
    max_preco_brl: 6000
    enabled: true

  - nome: Passagem barata saindo de SP
    kind: voo
    origens: [GRU, VCP, CGH, SAO]
    max_preco_brl: 1500
    enabled: true

  - nome: Firehose — tudo saindo de SP
    kind: voo
    origens: [GRU, VCP, CGH, SAO]
    enabled: true

  - nome: Bônus de transferência
    kind: promo
    programas: [Smiles, LATAM Pass, Azul Fidelidade, Livelo, Esfera]
    min_bonus_pct: 80
    enabled: true
